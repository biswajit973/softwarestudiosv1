<section class="section pricing" id="pricing">
  <div class="container">
    <app-section-heading overline="Pricing" title="Clear Pricing. No Hidden Charges."
      subtitle="We tell you the price upfront. No surprises, no confusion."></app-section-heading>

    <article class="pricing__card reveal" appRevealOnScroll>
      <p class="pricing__star">🌟 Starting at just</p>
      <h3>{{ pricing.startingPrice }}</h3>
      <p class="pricing__copy">
        Start your website or app at a low price. We will guide you step by step.
        No hidden charges. Call us to get your price.
      </p>

      <div class="pricing__actions">
        <app-primary-cta [label]="pricing.ctaPrimary" routerLink="/contact"></app-primary-cta>
        <app-secondary-cta [label]="pricing.ctaSecondary" [href]="'tel:+916370931250'"></app-secondary-cta>
      </div>

      <ul class="pricing__points">
        <li *ngFor="let feature of pricing.features">✓ {{ feature }}</li>
      </ul>
    </article>
  </div>
</section>
